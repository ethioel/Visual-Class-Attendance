# Visual Class Attendance — Streamlit theme & chrome
# Dark mode is handled in-app by the 🌓 toggle (CSS layer), so the base here
# stays light. Users who prefer permanent dark can also use ⋮ → Settings → Theme.

[theme]
base = "light"
primaryColor = "#eeeeee"
secondaryBackgroundColor = "#8d88db"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 25
