[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-calss-attendance"
version = "2.0.0"
description = "Face-recognition attendance with multi-sample enrollment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "opencv-python-headless>=4.9",
    "face-recognition>=1.3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "huggingface_hub>=0.23"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["attendance"]
