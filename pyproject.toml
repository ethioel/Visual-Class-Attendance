[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-class-attendance"
version = "2.4.0"
description = "Face-recognition attendance with multi-sample enrollment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "opencv-python-headless>=4.9,<5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.49", "streamlit-webrtc>=0.47", "av>=12", "huggingface_hub>=0.23"]
ml = ["torch==2.2.2+cpu", "torchvision==0.17.2+cpu", "facenet-pytorch==2.6.0"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["attendance"]
